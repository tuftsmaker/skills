name: Skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: registry + sandbox (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: index.json matches the skills
        run: |
          ./tools/skill-publish/rebuild.sh
          git diff --exit-code -- index.json

      - name: The sandbox bootstraps from nothing
        run: sh breadboard-wiring/ensure-runtime.sh

      - name: A wiring diagram renders
        run: |
          PY="$HOME/.venvs/ent164-maker/bin/python"
          "$PY" breadboard-wiring/render.py breadboard-wiring/circuits/led.yml \
            -o /tmp/led --no-png --no-open --no-gallery
          test -s /tmp/led.svg

      - name: A DXF becomes the laser file
        run: |
          PY="$HOME/.venvs/ent164-maker/bin/python"
          "$PY" laser-ready/laser/laser_svg.py tools/ci/part.dxf -o /tmp/part-laser.svg
          grep -q 'inkscape-stroke:hairline' /tmp/part-laser.svg

      - name: A box and an engraved birdhouse generate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          PY="$HOME/.venvs/ent164-maker/bin/python"
          "$PY" box-maker/box.py --length 150 --width 100 --height 60 -o /tmp/box.svg
          "$PY" box-maker/birdhouse.py --engrave -o /tmp/birdhouse.svg
          grep -q 'data:image/png;base64' /tmp/birdhouse.svg

  windows:
    name: sandbox + render (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: The sandbox bootstraps from nothing
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File breadboard-wiring/ensure-runtime.ps1

      - name: A wiring diagram renders
        shell: pwsh
        run: |
          $py = Join-Path $HOME ".venvs\ent164-maker\Scripts\python.exe"
          & $py breadboard-wiring/render.py breadboard-wiring/circuits/led.yml `
            -o "$env:TEMP\led" --no-png --no-open --no-gallery
          if (-not (Test-Path "$env:TEMP\led.svg")) { throw "no SVG was written" }
