board: freenove-esp32-wrover
title: Thermistor — Freenove ESP32-WROVER (FNK0046)
subtitle: Temperature as a voltage divider on GPIO 32
components:
  - {type: thermistor, at: [2, c]}
  - {type: resistor, value: "10k", from: [3, e], span: 4}
wires:
  - {from: bb.2.c, to: board.L17, color: red, label: 3V3}
