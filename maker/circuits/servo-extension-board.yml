board: freenove-esp32-wrover-ext
title: Servo on the GPIO extension board — Freenove ESP32-WROVER (FNK0046)
subtitle: "The class setup — ESP32 seated on the extension board"
components:
  - {type: servo, id: servo, at: [3, c]}
wires:
  - {from: servo.GND, to: board.L14, color: black, label: brown — GND}
  - {from: servo.5V, to: board.L19, color: red, label: red — 5V}
  - {from: servo.SIG, to: board.GPIO15, color: orange, label: orange — GPIO 15}
notes:
  - "Each pin has one pad on the extension board — jumper wires plug straight into it."
  - "This is how the ESP32 sits in class — plugged into the extension board, not on the breadboard."
