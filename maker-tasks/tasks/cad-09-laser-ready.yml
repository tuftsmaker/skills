id: cad-09-laser-ready
title: Preparing a DXF for the Laser
unit: laser-ready-file
order: 9
video: laser-cutting/videos/preparing-a-dxf-in-inkscape.mp4
poster: laser-cutting/posters/preparing-a-dxf-in-inkscape.png
time: "3:15"
makes: One prepared SVG
goal: |
  Take one of your parts and make the file the laser actually reads: pure-red
  hairline cut lines, no shape filled except one you mean to etch in black, and
  the page in millimetres. Do it by hand in Inkscape with the video, or run the
  checker with --svg and then open the result in Inkscape to check it and add
  any etched text.
spec: |
  One of your parts, prepared for the laser: part-laser-ready.svg with red
  hairline cut lines and, if you want one, a black etch.
submitted: |
  part-laser-ready.svg
  manifest.md
submit:
  - name: part-laser-ready.svg
    required: true
    note: the file the laser reads
  - name: manifest.md
    required: true
    note: which DXF it came from, and how you prepared it
prereqs: [cad-08-laser-joints]
signoff: ta
criteria:
  - id: present
    title: The laser file is there
    check: checks.file_present
    args: { name: part-laser-ready.svg }
  - id: svg
    title: It opens as an SVG, in millimetres
    check: checks.svg_parses
  - id: colours
    title: Red hairlines cut; anything filled is black
    check: checks.svg_laser_ready
  - id: source
    title: The DXF it was prepared from is recorded
    check: checks.manifest_field
    args:
      field: source_dxf
      hint: "Add a line: source_dxf: part.dxf — which task it came from helps the TA find your Onshape document."
  - id: selfcheck
    title: You ran the checker on this file
    check: checks.manifest_selfcheck
  - id: look
    title: A person opens it and it is the right part
    human: true
    review: |
      Open part-laser-ready.svg in Inkscape or UCP: it is the part you meant, at
      the size you designed, and any etch text is where you want it.
